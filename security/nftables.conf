#!/usr/sbin/nft -f
# Firewall de midistro: se niega TODO lo que entra salvo lo listado aqui.
flush ruleset

table inet filtro {
    chain entrada {
        type filter hook input priority filter; policy drop;

        # Paquetes que no pertenecen a ninguna conexion valida
        ct state invalid drop

        # Respuestas a conexiones que la propia maquina inicio (apt, pacman, git...)
        ct state established,related accept

        # Trafico interno de la maquina consigo misma
        iif lo accept

        # ICMP: ping y los mensajes que el protocolo necesita (con limite de tasa)
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
        # ICMPv6 tambien es necesario para que IPv6 funcione (descubrimiento de vecinos)
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

        # Respuestas del servidor DHCP (NetworkManager obtiene la IP asi)
        udp sport 67 udp dport 68 accept

        # SSH: solo conexiones NUEVAS y solo desde las redes de la VM
        # (192.168.56.0/24 = host-only con Windows, 10.0.2.0/24 = NAT de VirtualBox)
        ip saddr { 192.168.56.0/24, 10.0.2.0/24 } tcp dport 22 ct state new accept

        # Lo que llega hasta aqui sera descartado por la politica.
        # Se registra (maximo 5 por minuto) y se cuenta para poder verlo en nft list ruleset.
        limit rate 5/minute log prefix "nft-entrada-denegada: "
        counter
    }

    chain reenvio {
        type filter hook forward priority filter; policy drop;
    }

    chain salida {
        type filter hook output priority filter; policy accept;
    }
}
